version: '3.8'
services:
  db:
    image: postgres:15-alpine # 가볍고 안정적인 버전
    container_name: logme-db
    environment:
      - POSTGRES_USER=logme_user   # 사용자 ID
      - POSTGRES_PASSWORD=logme_password # 비밀번호
      - POSTGRES_DB=logme_db      # 생성할 데이터베이스 이름
    ports:
      - "5432:5432"              # 로컬포트:컨테이너포트
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: