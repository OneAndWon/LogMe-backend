
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구글 토큰 발급기</title>
</head>
<body>
    <h2>🚀 구글 로그인 테스트 (id_token 발급)</h2>
    
    <div id="g_id_onload"
         data-client_id="1098157188203-egig0a0ru2qdhvmmfg3mpg94h084nfrp.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    
    <div class="g_id_signin" data-type="standard"></div>

    <h3>발급된 토큰 (아래 값을 복사해서 Swagger에 넣으세요):</h3>
    <textarea id="token-result" rows="10" cols="100" placeholder="로그인하면 여기에 토큰이 뜹니다..."></textarea>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        function handleCredentialResponse(response) {
            // 구글에서 응답받은 id_token을 텍스트 박스에 띄워줍니다.
            document.getElementById('token-result').value = response.credential;
            alert("토큰이 발급되었습니다! 텍스트 박스에서 복사하세요.");
        }
    </script>
</body>
</html>
