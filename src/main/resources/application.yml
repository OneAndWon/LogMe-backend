# ---------------------------------
# (1) 공통 설정 (모든 프로필에 적용)
# ---------------------------------
spring:
  application:
    name: my-awesome-app

  # 기본 프로필을 local로 설정 (지정하지 않을 경우 local가 활성화됨)
  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB      # 파일 하나당 최대 크기
      max-request-size: 10MB   # 요청 전체 최대 크기

  jpa:
    show-sql: true # SQL 쿼리 로깅 (개발 시 유용)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    # 참고: camelCase -> snake_case 매핑 전략(SpringPhysicalNamingStrategy)은
    # Spring Boot JPA의 기본값이므로 별도로 명시할 필요가 없습니다.

  # Swagger (Springdoc)
  springdoc:
    api-docs:
      path: /api-docs
    swagger-ui:
      path: /swagger-ui.html
    info:
      title: "LogMe API Documentation"
      version: "v1.0.0"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}

# JWT 시크릿 키 (터미널에서 'openssl rand -base64 64'로 생성)
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: 3600 # 1시간
---

# ---------------------------------
# (2) 'local' 프로필
# ---------------------------------
spring:
  config:
    activate:
      on-profile: local # 'local' 프로필일 때 이 설정이 활성화됨

  cloud:
    aws:
      s3:
        enabled: false
      region:
        static: ap-northeast-2  # (혹시 몰라 더미 값 넣어둠)
      stack:

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/logme_db
    username: logme_user
    password: logme_password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      # ddl-auto: create
    properties:
      hibernate:
        # SQL 쿼리를 터미널에서 보기 편하게 포맷팅
        format_sql: true
    # 터미널에 실행되는 SQL 쿼리 로그를 보여줌 (디버깅에 유용)
    show-sql: true

---

# ---------------------------------
# (3) 'prod' 프로필 (배포용: PostgreSQL)
# ---------------------------------
spring:
  config:
    activate:
      on-profile: prod # 'prod' 프로필일 때 이 설정이 활성화됨

  datasource:
    driver-class-name: org.postgresql.Driver
    # 실제 운영 DB 주소 (보안을 위해 환경 변수 사용 권장)
    url: jdbc:postgresql://${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}
    username: ${PROD_DB_USER}
    password: ${PROD_DB_PASS}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # 운영 환경에서는 스키마를 자동으로 변경하지 않음
    # 'validate': 스키마가 맞는지 검증
    # 'none': 아무것도 하지 않음 (가장 안전)
    hibernate:
      ddl-auto: validate

    # 운영 환경에서는 SQL 로깅 비활성화 (성능 저하 방지)
    show-sql: false