plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.haru'
version = '0.0.1-SNAPSHOT'
description = 'haru-record LogMe'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	//runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //JWT (토큰 생성 및 검증)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    //Swagger (Springdoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    // Spring Boot 3.3+ (Hibernate 6.5)
    //PostgreSQL의 JSONB 타입 지원
    // UserSettings, AiReport의 JSON 타입 매핑을 위해 필요
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.8.2'

    //.env
    //implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // AWS S3 연동 라이브러리 (Spring Cloud AWS 3.x)
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.0'
}

tasks.named('test') {
	useJUnitPlatform()
}
