name: Deploy to EC2 + RDS + S3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 수동 실행도 허용

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 코드를 가져옴
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 21 세팅 (GitHub 컴퓨터 환경 설정)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드 수행 (GitHub 컴퓨터에서 실행, 테스트 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5-1. 완성된 JAR 파일 전송 (껍질 벗겨서 알맹이만)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/LogMe-backend"
          strip_components: 2  # build/libs 경로 제거 (필수)

      # 5-2. 실행 스크립트(start.sh) 전송 (그대로 전송)
      - name: Copy Script to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "start.sh"
          target: "/home/ec2-user/LogMe-backend"
          # 여기는 strip_components 옵션을 뺐음 (그래야 start.sh가 안 사라짐)

      # 6. EC2에 접속해서 재시작
      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # 1. 프로젝트 폴더로 이동
            cd /home/ec2-user/LogMe-backend
            
            # 2. 실행 권한 확실하게 부여
            chmod +x start.sh
            
            # 3. start.sh 실행 (기존 서버 종료 + 새 서버 실행)
            ./start.sh
            
            echo "🎉 배포 완료."