name: Deploy to EC2 + RDS + S3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 코드를 가져옴
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 21 세팅 (여기서 21버전으로 빌드 환경을 만듦)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드 수행 (GitHub 컴퓨터에서 실행)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      네, 방금 말씀드린 대로 **"JAR 파일 보내기"**와 **"스크립트(start.sh) 보내기"**를 분리해서, 파일이 증발하지 않도록 수정한 완벽한 전체 코드입니다.

  이 코드를 그대로 복사해서 .github/workflows/deploy.yml 파일에 덮어쓰세요!
  
  YAML
name: Deploy to EC2 + RDS + S3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 코드를 가져옴
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 21 세팅 (GitHub 컴퓨터 환경 설정)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드 수행 (GitHub 컴퓨터에서 실행, 테스트 제외)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5-1. 완성된 JAR 파일 전송 (껍질 벗겨서 알맹이만)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/LogMe-backend"
          strip_components: 2  # build/libs 경로 제거 (필수)

      # 5-2. 실행 스크립트(start.sh) 전송 (그대로 전송)
      - name: Copy Script to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "start.sh"
          target: "/home/ec2-user/LogMe-backend"
          # 여기는 strip_components 옵션을 뺐음. (그래야 start.sh가 안 사라짐)

      # 6. EC2에 접속해서 재시작 (이제 빌드 과정 없이 바로 실행)
      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # EC2 내부 작업 시작
            cd /home/ec2-user/LogMe-backend
            
            # 실행 권한 확실하게 주기
            chmod +x start.sh
            
            # start.sh 실행 (내부에서 기존 프로세스 종료 및 새 jar 실행)
            ./start.sh
            
            echo "🎉 배포 완료."