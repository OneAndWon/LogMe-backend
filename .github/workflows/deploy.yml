name: Deploy to EC2 + RDS + S3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 깃허브 코드를 가져옴
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 21 세팅 (여기서 21버전으로 빌드 환경을 만듦)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3. Gradle 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드 수행 (GitHub 컴퓨터에서 실행)
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 5. 완성된 jar 파일을 EC2로 전송 (SCP)
      - name: Copy Jar to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/LogMe-backend"
          strip_components: 2 # build/libs 경로를 떼고 jar 파일만 딱 넣기 위함

      # 6. EC2에 접속해서 재시작 (이제 빌드 과정 없이 바로 실행)
      - name: Restart Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # EC2 내부 작업 시작
            cd /home/ec2-user/LogMe-backend
            
            # 실행 권한 확실하게 주기
            chmod +x start.sh
            
            # start.sh 실행 (내부에서 기존 프로세스 종료 및 새 jar 실행)
            ./start.sh
            
            echo "🎉 배포 완료."